<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisuStruct – Java-Labor (Prototyp)</title>
<!-- Prototyp: echtes Java (inkl. Swing) im Browser mit CheerpJ (https://cheerpj.com).
     Die CheerpJ-Laufzeit kommt vom CDN des Herstellers (Community-Lizenz erlaubt nur dieses CDN).
     javac stammt aus tools.jar (OpenJDK 8): liegt die Datei neben dieser Seite, wird sie genommen,
     sonst wird sie einmalig aus dem JavaFiddle-Repo (Apache-2.0) geladen. -->
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --fg:#1c1f24; --panel:#fff; --line:#d8dce2; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --fg:#e8eaee; --panel:#1f2227; --line:#343840; --accent:#6b9cff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  button, select { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  main { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:12px; padding:12px 16px; height:calc(100vh - 56px); }
  @media (max-width: 800px) { main { grid-template-columns:1fr; height:auto; } }
  textarea { width:100%; height:100%; min-height:320px; resize:none; font:14px/1.45 ui-monospace, Menlo, monospace; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); tab-size:4; }
  .right { display:grid; grid-template-rows: minmax(260px,1fr) 180px; gap:12px; min-height:0; }
  #display { position:relative; border:1px solid var(--line); border-radius:8px; background:#e9ecf0; overflow:hidden; min-height:260px; }
  #console { margin:0; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:8px 10px; overflow:auto; font:13px/1.4 ui-monospace, Menlo, monospace; white-space:pre-wrap; }
  #status { font-size:13px; opacity:.75; }
</style>
</head>
<body>
<header>
  <h1>☕ Java-Labor <small style="font-weight:400;opacity:.6">(Prototyp mit CheerpJ)</small></h1>
  <select id="beispiel" aria-label="Beispiel">
    <option value="swing">Swing: Fenster mit Knopf</option>
    <option value="konsole">Konsole: Hallo Welt</option>
  </select>
  <button id="start" class="primary" disabled>▶ Kompilieren &amp; starten</button>
  <span id="status">Java wird geladen …</span>
</header>
<main>
  <textarea id="code" spellcheck="false" aria-label="Java-Quelltext"></textarea>
  <div class="right">
    <div id="display" aria-label="Swing-Fenster"></div>
    <pre id="console" aria-label="Konsole"></pre>
  </div>
</main>
<script>
const BEISPIELE = {
  swing: `import javax.swing.*;
import java.awt.*;

public class Zaehler {
    public static void main(String[] args) {
        SwingUtilities.invokeLater(() -> {
            JFrame fenster = new JFrame("Zähler");
            JLabel anzeige = new JLabel("0", SwingConstants.CENTER);
            anzeige.setFont(new Font("SansSerif", Font.BOLD, 48));
            JButton knopf = new JButton("+1");
            int[] zahl = {0};
            knopf.addActionListener(e -> {
                zahl[0]++;
                anzeige.setText("" + zahl[0]);
                System.out.println("Geklickt: " + zahl[0]);
            });
            fenster.add(anzeige, BorderLayout.CENTER);
            fenster.add(knopf, BorderLayout.SOUTH);
            fenster.setSize(260, 200);
            fenster.setLocationRelativeTo(null);
            fenster.setVisible(true);
        });
    }
}
`,
  konsole: `public class Hallo {
    public static void main(String[] args) {
        for (int i = 1; i <= 5; i++) {
            System.out.println("Hallo Welt Nr. " + i);
        }
    }
}
`,
};

const $ = (id) => document.getElementById(id);
const status = (t) => { $('status').textContent = t; };
let toolsJar = null;   // Pfad von tools.jar im CheerpJ-Dateisystem
let lauf = 0;          // jeder Lauf bekommt ein eigenes Ausgabeverzeichnis

$('code').value = BEISPIELE.swing;
$('beispiel').onchange = () => { $('code').value = BEISPIELE[$('beispiel').value]; };
$('code').addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
});

// Klassenname der öffentlichen Klasse (Dateiname muss passen), sonst der Klasse mit main.
function klassenname(quelltext) {
  const m = quelltext.match(/public\s+(?:final\s+)?class\s+(\w+)/) || quelltext.match(/class\s+(\w+)/);
  return m ? m[1] : 'Main';
}

async function ladeTools() {
  const lokal = new URL('tools.jar', location.href);
  const kopf = await fetch(lokal, { method: 'HEAD' }).catch(() => null);
  if (kopf && kopf.ok) return '/app' + lokal.pathname;
  status('Compiler (javac, 18 MB) wird geladen …');
  const antwort = await fetch('https://raw.githubusercontent.com/leaningtech/javafiddle/main/static/tools.jar');
  if (!antwort.ok) throw new Error('tools.jar nicht erreichbar');
  cheerpjAddStringFile('/str/tools.jar', new Uint8Array(await antwort.arrayBuffer()));
  return '/str/tools.jar';
}

async function starten() {
  $('start').disabled = true;
  $('console').textContent = '';
  const name = klassenname($('code').value);
  const ziel = `/files/lauf${++lauf}/`;
  cheerpjAddStringFile(`/str/${name}.java`, $('code').value);
  status('Kompiliere …');
  const t0 = performance.now();
  const ok = await cheerpjRunMain('com.sun.tools.javac.Main', toolsJar,
    `/str/${name}.java`, '-d', ziel, '-encoding', 'UTF-8');
  if (ok !== 0) {
    status('Fehler beim Kompilieren – siehe Konsole.');
    $('start').disabled = false;
    return;
  }
  status(`Kompiliert in ${((performance.now() - t0) / 1000).toFixed(1)} s – Programm läuft.`);
  $('start').disabled = false;
  // main läuft weiter, solange Swing-Fenster offen sind; darum nicht darauf warten.
  cheerpjRunMain(name, `${ziel}:${toolsJar}`).then((code) => {
    if (code !== undefined) status(`Programm beendet (Code ${code}).`);
  });
}
$('start').onclick = starten;

(async () => {
  const t0 = performance.now();
  try {
    await cheerpjInit({ status: 'none' });
    cheerpjCreateDisplay(-1, -1, $('display'));
    toolsJar = await ladeTools();
    status(`Bereit (Laden: ${((performance.now() - t0) / 1000).toFixed(1)} s). Der erste Lauf dauert länger.`);
    $('start').disabled = false;
  } catch (e) {
    status('Java konnte nicht geladen werden: ' + e.message);
  }
})();
</script>
</body>
</html>

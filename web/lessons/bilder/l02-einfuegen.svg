<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#1c1c1e">
  <rect width="400" height="190" fill="#ffffff"/>
  <text x="20" y="24" font-weight="600">Wohin landet das Element?</text>
  <rect x="20" y="40" width="190" height="35" fill="#dbeafe"/>
  <rect x="20" y="75" width="190" height="35" fill="#dcfce7"/>
  <line x1="20" y1="75" x2="210" y2="75" stroke="#6e6e73" stroke-dasharray="4 3"/>
  <rect x="20" y="40" width="190" height="70" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <text x="115" y="62" text-anchor="middle" fill="#1d4ed8">obere Hälfte</text>
  <text x="115" y="97" text-anchor="middle" fill="#15803d">untere Hälfte</text>
  <text x="224" y="62">→ kommt <tspan font-weight="600">davor</tspan></text>
  <text x="224" y="97">→ kommt <tspan font-weight="600">dahinter</tspan></text>
  <rect x="20" y="132" width="190" height="40" fill="#fef3c7" stroke="#1c1c1e" stroke-width="2"/>
  <text x="115" y="157" text-anchor="middle" font-size="16">ø</text>
  <text x="224" y="157">→ <tspan font-weight="600">ersetzt</tspan> den Platzhalter</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1c1c1e">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1c1e"/></marker></defs>
  <rect width="400" height="230" fill="#ffffff"/>
  <text x="100" y="22" text-anchor="middle" font-weight="600">kopfgesteuert (While)</text>
  <text x="300" y="22" text-anchor="middle" font-weight="600">fußgesteuert (Do-while)</text>
  <line x1="200" y1="10" x2="200" y2="220" stroke="#d1d1d6"/>
  <rect x="35" y="44" width="130" height="36" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="100" y="67" text-anchor="middle">① Bedingung</text>
  <rect x="35" y="124" width="130" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="100" y="147" text-anchor="middle">② Inhalt</text>
  <rect x="235" y="44" width="130" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="300" y="67" text-anchor="middle">① Inhalt</text>
  <rect x="235" y="124" width="130" height="36" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="300" y="147" text-anchor="middle">② Bedingung</text>
  <g fill="none" stroke="#1c1c1e" stroke-width="1.6" marker-end="url(#a)">
    <line x1="100" y1="80" x2="100" y2="122"/>
    <path d="M35 142 C8 142, 8 62, 33 62"/>
    <line x1="300" y1="80" x2="300" y2="122"/>
    <path d="M365 142 C392 142, 392 62, 367 62"/>
  </g>
  <text x="106" y="106" fill="#15803d" font-weight="600">true</text>
  <text x="380" y="106" text-anchor="end" fill="#15803d" font-weight="600">true</text>
  <text x="100" y="190" text-anchor="middle" fill="#6e6e73">Ist die Bedingung gleich false,</text>
  <text x="100" y="206" text-anchor="middle" fill="#6e6e73">läuft der Inhalt <tspan font-weight="700" fill="#1c1c1e">nie</tspan>.</text>
  <text x="300" y="190" text-anchor="middle" fill="#6e6e73">Der Inhalt läuft immer</text>
  <text x="300" y="206" text-anchor="middle" fill="#6e6e73"><tspan font-weight="700" fill="#1c1c1e">mindestens einmal</tspan>.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#1c1c1e">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#007aff"/></marker></defs>
  <rect width="400" height="250" fill="#ffffff"/>

  <text x="184" y="126" text-anchor="middle" fill="#6e6e73" font-size="12">auf: Tablet</text>
  <!-- Preisschild -->
  <path d="M250 34 L366 34 L366 96 L250 96 L236 65 Z" fill="#fff8e6" stroke="#1c1c1e" stroke-width="2" stroke-linejoin="round"/>

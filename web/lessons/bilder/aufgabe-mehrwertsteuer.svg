  <rect x="320" y="152" width="57" height="38" fill="#ff9500"/>
  <text x="348.5" y="176" text-anchor="middle" fill="#ffffff" font-weight="600">190 €</text>
  <text x="377" y="144" text-anchor="end" fill="#c26a00" font-size="12" font-weight="600">+ 19 % MwSt: 1000 * 0.19 = 190 €</text>

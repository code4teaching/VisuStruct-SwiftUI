<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#1c1c1e">
  <style>
    .s, .d { animation: 8s linear infinite; }
    .v { animation: 24s step-end infinite; opacity: 0; }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; }
    .d1 { animation-name: d1; } .d2 { animation-name: d2; } .d3 { animation-name: d3; } .d4 { animation-name: d4; }
    .press { animation: press 8s linear infinite; }
    @keyframes s1 { 0%, 22% { opacity: 1; } 25%, 97% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes s2 { 0%, 22% { opacity: 0; } 25%, 47% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 47% { opacity: 0; } 50%, 72% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 72% { opacity: 0; } 75%, 97% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes d1 { 0% { opacity: 1; transform: translateY(0); } 22% { opacity: 1; transform: translateY(54px); } 23%, 100% { opacity: 0; transform: translateY(54px); } }
    @keyframes d2 { 0%, 25% { opacity: 0; transform: translateY(0); } 25.1% { opacity: 1; transform: translateY(0); } 47% { opacity: 1; transform: translateY(54px); } 48%, 100% { opacity: 0; transform: translateY(54px); } }
    @keyframes d3 { 0%, 50% { opacity: 0; transform: translateY(0); } 50.1% { opacity: 1; transform: translateY(0); } 72% { opacity: 1; transform: translateY(-54px); } 73%, 100% { opacity: 0; transform: translateY(-54px); } }
    @keyframes d4 { 0%, 75% { opacity: 0; transform: translateY(0); } 75.1% { opacity: 1; transform: translateY(0); } 97% { opacity: 1; transform: translateY(-54px); } 98%, 100% { opacity: 0; transform: translateY(-54px); } }
    @keyframes press { 0%, 6% { fill: #cfe3ff; } 9%, 100% { fill: #ffffff; } }
    @keyframes m0 { 0% { opacity: 1; } 10.42% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes m1 { 0% { opacity: 0; } 10.42% { opacity: 1; } 43.75%, 100% { opacity: 0; } }
    @keyframes m2 { 0% { opacity: 0; } 43.75% { opacity: 1; } 77.08%, 100% { opacity: 0; } }
    @keyframes m3 { 0% { opacity: 0; } 77.08% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes w0 { 0% { opacity: 1; } 27.08% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes w1 { 0% { opacity: 0; } 27.08% { opacity: 1; } 60.42%, 100% { opacity: 0; } }
    @keyframes w2 { 0% { opacity: 0; } 60.42% { opacity: 1; } 93.75%, 100% { opacity: 0; } }
    @keyframes w3 { 0% { opacity: 0; } 93.75% { opacity: 1; } 100% { opacity: 0; } }
    .m0 { animation-name: m0; } .m1 { animation-name: m1; } .m2 { animation-name: m2; } .m3 { animation-name: m3; }
    .w0 { animation-name: w0; } .w1 { animation-name: w1; } .w2 { animation-name: w2; } .w3 { animation-name: w3; }
    @media (prefers-reduced-motion: reduce) {
      .s, .d, .v, .press { animation: none; }
      .s { opacity: 1; } .d, .v { opacity: 0; } .m1, .w1 { opacity: 1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#007aff"/></marker>
  </defs>
  <rect width="400" height="440" fill="#ffffff"/>
  <rect x="115" y="16" width="170" height="96" rx="10" fill="#f2f2f7" stroke="#8e8e93" stroke-width="1.5"/>
  <text x="200" y="40" text-anchor="middle" font-size="15" font-weight="700">View</text>
  <text x="200" y="59" text-anchor="middle" font-size="13" fill="#6e6e73">die Anzeige</text>
  <rect x="115" y="176" width="170" height="64" rx="10" fill="#f2f2f7" stroke="#8e8e93" stroke-width="1.5"/>
  <text x="200" y="200" text-anchor="middle" font-size="15" font-weight="700">Controller</text>
  <text x="200" y="219" text-anchor="middle" font-size="13" fill="#6e6e73">der Zuhörer</text>
  <rect x="115" y="304" width="170" height="96" rx="10" fill="#f2f2f7" stroke="#8e8e93" stroke-width="1.5"/>
  <text x="200" y="328" text-anchor="middle" font-size="15" font-weight="700">Model</text>
  <text x="200" y="347" text-anchor="middle" font-size="13" fill="#6e6e73">Zaehler</text>
  <rect x="134" y="70" width="58" height="36" rx="4" fill="#ffffff" stroke="#c7c7cc"/>
  <text class="v w0" x="163" y="96" text-anchor="middle" font-size="22" font-weight="700">0</text>
  <text class="v w1" x="163" y="96" text-anchor="middle" font-size="22" font-weight="700">1</text>
  <text class="v w2" x="163" y="96" text-anchor="middle" font-size="22" font-weight="700">2</text>
  <text class="v w3" x="163" y="96" text-anchor="middle" font-size="22" font-weight="700">3</text>
  <rect class="press" x="208" y="74" width="58" height="28" rx="6" fill="#ffffff" stroke="#8e8e93"/>
  <text x="237" y="93" text-anchor="middle" font-weight="600">+1</text>
  <rect x="134" y="358" width="132" height="32" rx="6" fill="#ffffff" stroke="#c7c7cc"/>
  <text class="v m0" x="200" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">wert = 0</text>
  <text class="v m1" x="200" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">wert = 1</text>
  <text class="v m2" x="200" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">wert = 2</text>
  <text class="v m3" x="200" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">wert = 3</text>
  <path d="M160 112V176" stroke="#8e8e93" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="152" y="148" text-anchor="end" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6e6e73">1 actionPerformed(e)</text>
  <g class="s s1"><path d="M160 112V176" stroke="#007aff" stroke-width="3" marker-end="url(#b)"/><text x="152" y="148" text-anchor="end" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#007aff">1 actionPerformed(e)</text></g>
  <circle class="d d1" cx="160" cy="115" r="5" fill="#007aff"/>
  <path d="M160 240V304" stroke="#8e8e93" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="152" y="276" text-anchor="end" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6e6e73">2 erhoehen()</text>
  <g class="s s2"><path d="M160 240V304" stroke="#007aff" stroke-width="3" marker-end="url(#b)"/><text x="152" y="276" text-anchor="end" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#007aff">2 erhoehen()</text></g>
  <circle class="d d2" cx="160" cy="243" r="5" fill="#007aff"/>
  <path d="M240 304V240" stroke="#8e8e93" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="248" y="276" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6e6e73">3 getWert()</text>
  <g class="s s3"><path d="M240 304V240" stroke="#007aff" stroke-width="3" marker-end="url(#b)"/><text x="248" y="276" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#007aff">3 getWert()</text></g>
  <circle class="d d3" cx="240" cy="301" r="5" fill="#007aff"/>
  <path d="M240 176V112" stroke="#8e8e93" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="248" y="148" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6e6e73">4 aktualisieren(wert)</text>
  <g class="s s4"><path d="M240 176V112" stroke="#007aff" stroke-width="3" marker-end="url(#b)"/><text x="248" y="148" text-anchor="start" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" fill="#007aff">4 aktualisieren(wert)</text></g>
  <circle class="d d4" cx="240" cy="173" r="5" fill="#007aff"/>
  <text x="200" y="428" text-anchor="middle" font-size="12.5" fill="#6e6e73">Das Model kennt weder die View noch den Controller.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 492" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1c1c1e">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c1c1e"/></marker></defs>
  <rect width="400" height="492" fill="#ffffff"/>
  <g stroke="#1c1c1e" stroke-width="2">
    <!-- Start -->
    <rect x="100" y="10" width="100" height="28" rx="14" fill="#d1f2d9"/>
    <line x1="150" y1="38" x2="150" y2="54" marker-end="url(#a)"/>
    <!-- Anweisung -->
    <rect x="50" y="56" width="200" height="30" fill="#e5f0ff"/>
    <line x1="150" y1="86" x2="150" y2="98" marker-end="url(#a)"/>
    <!-- Raute 1 -->
    <path d="M150 100 L235 128 L150 156 L65 128 Z" fill="#fff4d6"/>
    <line x1="150" y1="156" x2="150" y2="172" marker-end="url(#a)"/>
    <rect x="50" y="174" width="200" height="30" fill="#e5f0ff"/>
    <line x1="150" y1="204" x2="150" y2="250" marker-end="url(#a)"/>
    <!-- nein-Weg um den Kasten herum -->
    <polyline points="235,128 285,128 285,222 150,222" fill="none" marker-end="url(#a)"/>
    <!-- Raute 2 -->
    <path d="M150 252 L235 280 L150 308 L65 280 Z" fill="#fff4d6"/>
    <line x1="235" y1="280" x2="268" y2="280" marker-end="url(#a)"/>
    <rect x="270" y="265" width="115" height="30" fill="#e5f0ff"/>
    <!-- zurück zur Prüfung -->
    <polyline points="327,265 327,238 150,238" fill="none" marker-end="url(#a)"/>
    <line x1="150" y1="308" x2="150" y2="326" marker-end="url(#a)"/>
    <rect x="50" y="328" width="200" height="30" fill="#e5f0ff"/>
    <line x1="150" y1="358" x2="150" y2="374" marker-end="url(#a)"/>
    <!-- Ende -->
    <rect x="100" y="376" width="100" height="28" rx="14" fill="#d1f2d9"/>
  </g>
  <g text-anchor="middle">
    <text x="150" y="29">Início</text>
    <text x="150" y="76">Pôr uma chávena na mesa</text>
    <text x="150" y="133">Quer açúcar?</text>
    <text x="150" y="194">Juntar açúcar</text>
    <text x="150" y="285">Chá muito quente?</text>
    <text x="327.5" y="285">Esperar 1 minuto</text>
    <text x="150" y="348">Beber o chá</text>
    <text x="150" y="395">Fim</text>
  </g>
  <g font-size="12" font-weight="600">
    <text x="156" y="168" fill="#248a3d">sim</text>
    <text x="242" y="122" fill="#d70015">não</text>
    <text x="240" y="274" fill="#248a3d">sim</text>
    <text x="156" y="320" fill="#d70015">não</text>
  </g>
  <!-- Legende -->
  <line x1="10" y1="418" x2="390" y2="418" stroke="#d1d1d6"/>
  <g stroke="#1c1c1e" stroke-width="1.5">
    <rect x="40" y="430" width="36" height="18" rx="9" fill="#d1f2d9"/>
    <rect x="220" y="430" width="36" height="18" fill="#e5f0ff"/>
    <path d="M58 458 L76 469 L58 480 L40 469 Z" fill="#fff4d6"/>
    <path d="M226 460 L256 460 L250 478 L220 478 Z" fill="#f2e6ff"/>
  </g>
  <g font-size="12" fill="#3a3a3c">
    <text x="86" y="443">Início ou fim</text>
    <text x="266" y="443">Instrução</text>
    <text x="86" y="473">Decisão</text>
    <text x="266" y="473">Entrada ou saída</text>
  </g>
</svg>

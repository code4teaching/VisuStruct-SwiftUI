<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#1c1c1e">
  <rect width="400" height="150" fill="#ffffff"/>
  <rect x="20" y="50" width="80" height="24" fill="#fee2e2"/><rect x="300" y="50" width="80" height="24" fill="#fee2e2"/>
  <rect x="100" y="50" width="200" height="24" fill="#dcfce7"/>
  <line x1="20" y1="74" x2="380" y2="74" stroke="#1c1c1e" stroke-width="2"/>
  <line x1="50" y1="68" x2="50" y2="80" stroke="#1c1c1e" stroke-width="2"/><text x="50" y="98" text-anchor="middle">0</text>
  <line x1="100" y1="68" x2="100" y2="80" stroke="#1c1c1e" stroke-width="2"/><text x="100" y="98" text-anchor="middle">1</text>
  <line x1="150" y1="68" x2="150" y2="80" stroke="#1c1c1e" stroke-width="2"/><text x="150" y="98" text-anchor="middle">2</text>

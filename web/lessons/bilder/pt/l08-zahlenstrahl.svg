  <line x1="250" y1="68" x2="250" y2="80" stroke="#1c1c1e" stroke-width="2"/><text x="250" y="98" text-anchor="middle">4</text>
  <line x1="300" y1="68" x2="300" y2="80" stroke="#1c1c1e" stroke-width="2"/><text x="300" y="98" text-anchor="middle">5</text>
  <line x1="350" y1="68" x2="350" y2="80" stroke="#1c1c1e" stroke-width="2"/><text x="350" y="98" text-anchor="middle">6</text>
  <circle cx="100" cy="74" r="6" fill="#15803d"/><circle cx="300" cy="74" r="6" fill="#15803d"/>
  <text x="200" y="40" text-anchor="middle" fill="#15803d" font-weight="600">válida</text>
  <text x="50" y="40" text-anchor="middle" fill="#b91c1c" font-weight="600">inválida</text><text x="350" y="40" text-anchor="middle" fill="#b91c1c" font-weight="600">inválida</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <text x="200" y="124" fill="#15803d">nota &gt;= 1 &amp;&amp; nota &lt;= 5</text>

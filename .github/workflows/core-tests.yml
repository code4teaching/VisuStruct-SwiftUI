name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: VisuStruct-iOS/VisuStructCore
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: swift test

  app-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -project VisuStruct-iOS/VisuStructXcodeOpen/VisuStruct.xcodeproj \
            -scheme VisuStruct \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

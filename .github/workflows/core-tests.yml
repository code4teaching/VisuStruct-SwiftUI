name: VisuStructCore tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: VisuStruct-iOS/VisuStructCore
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: swift test

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: VisuStruct-iOS/VisuStructCore
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: swift test

  app-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -project VisuStruct-iOS/VisuStructXcodeOpen/VisuStruct.xcodeproj \
            -scheme VisuStruct \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test (Dateiformat gegen VisuStruct-Dateien)
        run: npm test
      - name: Build
        run: npm run build

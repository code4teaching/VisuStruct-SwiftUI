# BEGIN VisuStruct-Cache (wird beim Deploy gesetzt, nicht von Hand ändern)
# Seiten immer beim Server nachfragen, damit nach einem Update kein altes index.html bleibt.
# Skripte und Stylesheets der App tragen einen Hash im Namen und dürfen lange im Cache bleiben.
<IfModule mod_headers.c>
  <FilesMatch "\.html?$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
  <If "%{REQUEST_URI} =~ m#/app/assets/#">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </If>
</IfModule>
# END VisuStruct-Cache

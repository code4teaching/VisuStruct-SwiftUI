<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#1c1c1e">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e5ce6"/><stop offset="0.55" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/><stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#007aff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff9500"/></marker>
  </defs>
  <rect width="400" height="260" fill="#ffffff"/>

  <!-- zugeklappt: Handy -->
  <rect x="14" y="24" width="44" height="86" rx="9" fill="url(#body)"/>
  <rect x="18" y="29" width="36" height="76" rx="6" fill="url(#screen)"/>
  <circle cx="36" cy="33" r="1.6" fill="#1c1c1e"/>
  <text x="36" y="58" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">12:34</text>
  <rect x="24" y="84" width="9" height="9" rx="2.5" fill="#ffffff" opacity="0.85"/>
  <rect x="39" y="84" width="9" height="9" rx="2.5" fill="#ffffff" opacity="0.85"/>
  <text x="36" y="128" text-anchor="middle" fill="#6e6e73" font-size="12">zu: Handy</text>

  <!-- aufklappen -->
  <path d="M64 58 Q92 34 120 58" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="92" y="80" text-anchor="middle" fill="#007aff" font-size="11" font-weight="600">aufklappen</text>

  <!-- aufgeklappt: Tablet -->
  <rect x="126" y="24" width="96" height="86" rx="9" fill="url(#body)"/>
  <rect x="130" y="29" width="88" height="76" rx="6" fill="url(#screen)"/>
  <line x1="174" y1="29" x2="174" y2="105" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <g fill="#ffffff" opacity="0.9">
    <rect x="138" y="38" width="12" height="12" rx="3"/><rect x="156" y="38" width="12" height="12" rx="3"/>
    <rect x="180" y="38" width="12" height="12" rx="3"/><rect x="198" y="38" width="12" height="12" rx="3"/>
    <rect x="138" y="58" width="12" height="12" rx="3"/><rect x="156" y="58" width="12" height="12" rx="3"/>
    <rect x="180" y="58" width="30" height="32" rx="4" opacity="0.6"/>
  </g>
  <!-- Sticker NEU -->
  <g transform="translate(214 26) rotate(12)">
    <path d="M0 -17 L5 -9 L14 -11 L11 -2 L17 4 L9 7 L8 16 L0 11 L-8 16 L-9 7 L-17 4 L-11 -2 L-14 -11 L-5 -9 Z" fill="#ffcc00" stroke="#1c1c1e" stroke-width="1.2"/>
    <text y="4" text-anchor="middle" font-size="9" font-weight="800">NEU</text>
  </g>
  <text x="174" y="128" text-anchor="middle" fill="#6e6e73" font-size="12">auf: Tablet</text>

  <!-- Kassenbon -->
  <path d="M248 14 H386 V112 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 l-6.9 6 l-6.9 -6 Z" fill="#fffdf5" stroke="#1c1c1e" stroke-width="1.5" stroke-linejoin="round"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    <text x="317" y="32" text-anchor="middle" font-weight="700">KASSENBON</text>
    <text x="256" y="50">Falt-Handy</text>
    <text x="256" y="66" fill="#007aff">netto</text><text x="380" y="66" text-anchor="end" fill="#007aff">1000,00 €</text>
    <text x="256" y="82" fill="#c26a00">+19% MwSt</text><text x="380" y="82" text-anchor="end" fill="#c26a00">190,00 €</text>
    <line x1="256" y1="89" x2="380" y2="89" stroke="#1c1c1e" stroke-dasharray="3 2"/>
    <text x="256" y="104" font-weight="700">SUMME</text><text x="380" y="104" text-anchor="end" font-weight="700">1190,00 €</text>
  </g>

  <!-- Balken -->
  <text x="20" y="152" fill="#6e6e73" font-size="12">So setzt sich der Preis zusammen:</text>
  <rect x="20" y="160" width="235" height="36" rx="4" fill="#007aff"/>
  <text x="137.5" y="183" text-anchor="middle" fill="#ffffff" font-weight="600">netto 1000 €</text>
  <rect x="255" y="160" width="45" height="36" fill="#ff9500"/>
  <text x="277.5" y="183" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">190 €</text>
  <path d="M300 178 Q318 178 328 192" fill="none" stroke="#ff9500" stroke-width="2.5" marker-end="url(#o)"/>

  <!-- Finanzamt -->
  <g transform="translate(330 168)">
    <path d="M0 18 L26 4 L52 18 Z" fill="#e5e5ea" stroke="#1c1c1e" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="4" y="18" width="44" height="4" fill="#e5e5ea" stroke="#1c1c1e" stroke-width="1.2"/>
    <g fill="#ffffff" stroke="#1c1c1e" stroke-width="1.2">
      <rect x="8" y="22" width="6" height="22"/><rect x="18" y="22" width="6" height="22"/><rect x="28" y="22" width="6" height="22"/><rect x="38" y="22" width="6" height="22"/>
    </g>
    <rect x="2" y="44" width="48" height="5" fill="#e5e5ea" stroke="#1c1c1e" stroke-width="1.2"/>
    <text x="26" y="64" text-anchor="middle" font-size="11" font-weight="700">Finanzamt</text>
  </g>

  <!-- Klammer Brutto -->
  <path d="M20 204 L20 211 L300 211 L300 204" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  <line x1="160" y1="211" x2="160" y2="218" stroke="#1c1c1e" stroke-width="2"/>
  <text x="160" y="238" text-anchor="middle" font-size="16" font-weight="700">brutto 1190 €</text>
  <text x="160" y="254" text-anchor="middle" fill="#6e6e73" font-size="12">Das zahlst du an der Kasse.</text>
</svg>

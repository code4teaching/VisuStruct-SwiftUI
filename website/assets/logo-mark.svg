<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="vs-bg" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a4dff8"/>
      <stop offset="0.42" stop-color="#76d3fe"/>
      <stop offset="1" stop-color="#2c78cf"/>
    </linearGradient>
    <linearGradient id="vs-pen-metal" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#d4d4d8"/>
      <stop offset="0.5" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="vs-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#0c4a6e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Squircle wie App-Icon -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#vs-bg)"/>
  <!-- Zeichendreieck (Set square), vereinfacht -->
  <g filter="url(#vs-soft)">
    <path fill="#f8fafc" fill-opacity="0.98"
      d="M17 46 V22 L43 46 H17 Z"/>
    <path fill="url(#vs-bg)" opacity="0.97"
      d="M22 41 V29 L35 41 H22 Z"/>
    <!-- kleine Skala auf Hypotenuse -->
    <path stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round"
      d="M24.5 38.5 L26 37 M27.2 36.3 L28.7 34.8 M29.4 33.6 L30.9 32.1 M31.6 31.4 L33.1 29.9"/>
  </g>
  <!-- Stift -->
  <g filter="url(#vs-soft)">
    <path fill="#f8fafc"
      d="M38 44 L44 18 L47 19 L41 45 Z"/>
    <rect x="43.2" y="16.5" width="4.2" height="3.5" rx="0.6" transform="rotate(12 45 18)" fill="url(#vs-pen-metal)"/>
    <path fill="#e2e8f0" d="M38.5 43.5 L40.5 44.5 L39.5 46.5 L37 45.5 Z"/>
  </g>
</svg>

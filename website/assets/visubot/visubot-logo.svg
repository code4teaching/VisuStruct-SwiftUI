<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">VisuBot</title>
  <desc id="desc">Modern VisuBot wordmark with a friendly wheeled bot in VisuStruct blue, navy and white, plus the claim Struktogramme - Robotik - Code.</desc>
  <g transform="translate(28 22)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Slim side-drive wheels, restored and lowered to touch the ground -->
    <rect x="57" y="140" width="21" height="48" rx="10.5" fill="#172B45"/>
    <circle cx="67.5" cy="164" r="3.5" fill="#3478E5"/>
    <rect x="157" y="140" width="21" height="48" rx="10.5" fill="#172B45"/>
    <circle cx="167.5" cy="164" r="3.5" fill="#3478E5"/>
    <!-- Light, modern chassis with a friendly display -->
    <path d="M87 122h60a11 11 0 0 1 11 11v36a11 11 0 0 1-11 11H87a11 11 0 0 1-11-11v-36a11 11 0 0 1 11-11z" fill="#FFFFFF" stroke="#172B45" stroke-width="4"/>
    <path d="M79 133h78" stroke="#3478E5" stroke-width="7"/>
    <circle cx="102" cy="148" r="4" fill="#172B45"/>
    <circle cx="132" cy="148" r="4" fill="#172B45"/>
    <path d="M104 160c4 4 8 6 13 6s9-2 13-6" fill="none" stroke="#3478E5" stroke-width="3.5"/>
    <!-- Antenna and small stabilizing caster -->
    <path d="M117 122V106" stroke="#172B45" stroke-width="4"/>
    <circle cx="117" cy="101" r="5" fill="#3478E5"/>
    <path d="M117 180v8" stroke="#172B45" stroke-width="4"/>
    <circle cx="117" cy="193" r="7" fill="#FFFFFF" stroke="#172B45" stroke-width="3"/>
  </g>
  <text x="251" y="151" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="110" font-weight="700" letter-spacing="-5" fill="#172B45">Visu<tspan fill="#3478E5">Bot</tspan></text>
  <path d="M258 174h399" stroke="#DCE4EC" stroke-width="2"/>
  <text x="259" y="208" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2.6" fill="#60748C">Struktogramme - Robotik - Code</text>
</svg>

<title>Termine mit Luísa</title>
<style>
  :root{--bg:#fff8f1;--card:#fff;--ink:#3b3047;--muted:#8a7f94;--line:#f1e4d8;--accent:#ff7a59;--err:#c2456b}
  @media (prefers-color-scheme: dark){:root{--bg:#1f1a26;--card:#2a2333;--ink:#f4eef8;--muted:#b3a8bd;--line:#3d3447;--accent:#ff9a7e;--err:#ff9fbb}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;border-top:6px solid var(--accent);box-shadow:0 10px 30px rgba(255,122,89,.15)}

  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:var(--err);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
